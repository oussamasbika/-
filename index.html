    <script>
      (function () {
        var audio = document.getElementById("welcome-greeting-audio");
        var state = { started: false, finished: false, audio: audio };
        window.__welcomeGreetingState = state;
        if (!audio) return;
        function applyPitch() {
          try {
            audio.preservesPitch = false;
            audio.mozPreservesPitch = false;
            audio.webkitPreservesPitch = false;
            audio.playbackRate = 1.18;
            audio.volume = 0.95;
          } catch (e) {}
        }
        applyPitch();
        audio.addEventListener("loadedmetadata", applyPitch);
        audio.addEventListener("playing", function () { state.started = true; });
        audio.addEventListener("ended", function () { state.finished = true; });
        try {
          var p = audio.play();
          if (p && typeof p.then === "function") {
            p.then(function () {
              state.started = true;
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
